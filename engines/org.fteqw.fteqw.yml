sources:
  - type: archive
    url: https://api.github.com/repos/fte-team/fteqw/zipball/2025-09-27
    sha256: 5cbbfeb4220dd6846f1eeb729666c723e42f6367a9cac3f287c1df03789da417
    dest-filename: fteqw.zip
    x-checker-data:
      type: json
      url: https://api.github.com/repos/fte-team/fteqw/releases/latest
      version-query: .tag_name
      url-query: .zipball_url
  - type: patch
    paths:
      - org.fteqw.fteqw.fixhomedir.patch
  - type: shell
    commands:
      - git apply dist/linux/org.fteqw.fteqw.fixdownloads.patch
config-opts:
  - -DFTE_INSTALL_BINDIR=bin
  # Use SDL3 instead of SDL2
  - -DFTE_DEP_SDL3=true
  # fteqcc is required for some of the plugins
  - -DFTE_TOOL_QCC=true
  # FFMPEG for extra audio format support (mp3 etc)
  - -DFTE_PLUG_FFMPEG=true
  # System menu plugin - requires fteqcc
  - -DFTE_MENU_SYS=true
  # EZQuake HUD script compatibility
  - -DFTE_PLUG_EZHUD=true
  # Quake Injector plugin
  - -DFTE_PLUG_QI=false
  # OpenSSL support
  - -DFTE_PLUG_OPENSSL=false
  # NameMaker plugin
  - -DFTE_PLUG_NAMEMAKER=false
  # IRC client chat
  - -DFTE_PLUG_IRC=false
  # XMPP chat
  - -DFTE_PLUG_XMPP=false
  # Blizzard MPQ file format
  - -DFTE_PLUG_MPQ=false
  # Half-Life 2 file formats
  - -DFTE_PLUG_HL2=false
  # Model formats
  - -DFTE_PLUG_MODELS=false
  # Counter-Strike addon
  - -DFTE_CSADDON=false
  # Quake 3 gamecode
  - -DFTE_PLUG_QUAKE3=false
  # Call of Duty file formats
  - -DFTE_PLUG_COD=false
  # X11 Server
  - -DFTE_PLUG_X11SV=false
  # MIDI audio
  - -DFTE_PLUG_TIMIDITY=false
  # OpenXR VR
  - -DFTE_PLUG_OPENXR=false
  # libCEF web browser
  - -DFTE_PLUG_CEF=false
  # Server tools: Dedicated server, QTV, master server and http server
  - -DFTE_ENGINE_SERVER_ONLY=false
  - -DFTE_TOOL_HTTPSV=false
  - -DFTE_TOOL_MASTER=false
  - -DFTE_TOOL_QTV=false
  # Dev tools
  - -DFTE_TOOL_IQM=false
  - -DFTE_TOOL_IMAGE=false
  - -DFTE_TOOL_QCVM=false
  - -DFTE_PLUG_TERRAINGEN=false
  - -DFTE_TOOL_QCCGUI=false
  # Physics engines
  - -DFTE_PLUG_ODE=false
  - -DFTE_PLUG_BULLET=false

post-install:
  - mv /app/share/icons/hicolor/scalable/apps/org.fteqw.fteqw.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.fteqw.svg
  - mv /app/share/games/quake/id1/* /app/share/games/librequake/id1/
  - rm -rf /app/share/games/quake
